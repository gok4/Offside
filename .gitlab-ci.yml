stages:
  - validate
  - deploy
  - release

validate-data:
  stage: validate
  image: python:3.11-slim
  script:
    - python scripts/match_players.py data/teams.json assets/player_cards

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r index.html css js data assets public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
